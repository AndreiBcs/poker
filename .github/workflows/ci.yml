name: CI

on:
  push:
    branches: [main, agents]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PokerGame.slnx
      - run: dotnet build PokerGame.slnx --configuration Release --no-restore
      # API/SignalR and browser integration suites remain opt-in for now.
      - run: dotnet test PokerGame.slnx --configuration Release --no-build --filter 'Category!=Integration'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
