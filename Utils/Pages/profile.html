<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker Arena - Profil</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <nav class="nav">
            <div class="logo">Poker Arena</div>
            <div class="nav-links">
                <a href="home.html">Acasa</a>
                <a href="lobbies.html">Lobby-uri</a>
                <a href="login.html">Login</a>
            </div>
        </nav>

        <section class="split">
            <div class="card">
                <h2>Profilul meu</h2>
                <p class="muted">Status: activ</p>
                <div class="grid">
                    <div class="card">
                        <h4>Rata castig</h4>
                        <p class="muted">62%</p>
                    </div>
                    <div class="card">
                        <h4>Turnee jucate</h4>
                        <p class="muted">18</p>
                    </div>
                    <div class="card">
                        <h4>Castig total</h4>
                        <p class="muted">12,400</p>
                    </div>
                </div>
            </div>
            <div class="card">
                <h3>Setari profil</h3>
                <form class="form">
                    <input class="input" type="text" placeholder="Nume afisat" />
                    <input class="input" type="text" placeholder="Avatar URL" />
                    <input class="input" type="text" placeholder="Tema preferata" />
                    <button class="button" type="button">Salveaza</button>
                </form>
            </div>
        </section>

        <section class="card">
            <h3>Istoric sesiuni</h3>
            <div class="lobby-list">
                <div class="lobby-item">
                    <div>
                        <strong>Rapid Ace</strong>
                        <div class="muted">Castig: +320 | Durata: 45 min</div>
                    </div>
                    <span class="badge">Finalizat</span>
                </div>
                <div class="lobby-item">
                    <div>
                        <strong>Noapte Lunga</strong>
                        <div class="muted">Castig: -120 | Durata: 30 min</div>
                    </div>
                    <span class="badge">Finalizat</span>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
