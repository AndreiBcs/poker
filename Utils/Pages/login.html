<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker Arena - Login</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <nav class="nav">
            <div class="logo">Poker Arena</div>
            <div class="nav-links">
                <a href="home.html">Acasa</a>
                <a href="lobbies.html">Lobby-uri</a>
                <a href="profile.html">Profil</a>
            </div>
        </nav>

        <section class="split">
            <div class="card">
                <h2>Intra in cont</h2>
                <p class="muted">Bine ai revenit! Foloseste datele tale.</p>
                <form class="form">
                    <input class="input" type="email" placeholder="Email" />
                    <input class="input" type="password" placeholder="Parola" />
                    <button class="button" type="button">Login</button>
                </form>
            </div>
            <div class="card">
                <h3>Nu ai cont?</h3>
                <p class="muted">Creeaza unul in 30 de secunde.</p>
                <form class="form">
                    <input class="input" type="text" placeholder="Nume afisat" />
                    <input class="input" type="email" placeholder="Email" />
                    <input class="input" type="password" placeholder="Parola" />
                    <button class="button alt" type="button">Creeaza cont</button>
                </form>
            </div>
        </section>

        <div class="footer">Ai nevoie de ajutor? Contacteaza suportul.</div>
    </div>
</body>

</html>
